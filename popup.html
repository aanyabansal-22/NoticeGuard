<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoticeGuard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- This is the Chrome extension popup shown when the toolbar icon is clicked. -->
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand-mark" aria-hidden="true">NG</div>
        <div>
          <p class="eyebrow">NOTICE VERIFICATION</p>
          <h1>NoticeGuard</h1>
        </div>
      </header>

      <p class="intro">Verify suspicious government notices before you act.</p>

      <form class="notice-form" onsubmit="return false;">
        <div class="field-group">
          <label for="noticeText">Paste a notice or message</label>
          <textarea id="noticeText" rows="6" placeholder="Paste the government notice here..."></textarea>
          <p class="field-hint">We’ll check for common warning signs and suspicious language.</p>
        </div>

        <div class="field-group">
          <label for="fileUpload">Upload a PDF or image <span>(optional)</span></label>
          <label class="file-picker" for="fileUpload">
            <span class="upload-icon" aria-hidden="true">↑</span>
            <span>Choose a file</span>
            <small>PDF, PNG, or JPG</small>
          </label>
          <input id="fileUpload" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" />
          <p id="fileName" class="file-name" aria-live="polite"></p>
        </div>

        <button id="analyzeBtn" class="analyze-button" type="button">
          <span>Analyze Notice</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <!-- JavaScript shows this while the analysis is running. -->
      <p id="loading" class="loading-state" hidden aria-live="polite">
        <span class="loader" aria-hidden="true"></span>
        Analyzing notice...
      </p>

      <!-- JavaScript dynamically adds the verdict, confidence, and reasons. -->
      <section id="result" class="result-card" hidden aria-live="polite"></section>

      <footer class="popup-footer">For guidance only — verify urgent notices through official channels.</footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
